crons:
  - name: city-blogs
    description: "Publishes the next batch of daily/weekly city recruiting blog posts every 30 minutes"
    cron: "*/30 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/city-blogs"
    method: POST
    enabled: true
  - name: fb-city-rollout
    description: "Posts one city recruiting post to the Facebook Page every 20 minutes (daily cap 60) until every city has one"
    cron: "*/20 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/fb-city-rollout"
    method: POST
    enabled: true
